name: Jackdaw
options:
  bundleIdPrefix: ch.orellbuehler
  developmentLanguage: en
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '16.2'

settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: 'NO'
    GENERATE_INFOPLIST_FILE: 'YES'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait'
    INFOPLIST_KEY_CFBundleDisplayName: Jackdaw

targets:
  Jackdaw:
    type: application
    platform: iOS
    sources:
      - path: Jackdaw
        excludes:
          - Jackdaw.entitlements
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: ch.orellbuehler.jackdaw
        # iCloud (CloudKit) and push for sync. Device SDK only: the unsigned simulator build used by CI has no
        # provisioning profile, and the app disables sync there (see CloudSync.isSupported).
        'CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]': Jackdaw/Jackdaw.entitlements
        # Link the KMP shared framework. Gradle builds it and stages it under
        # shared/build/xcode-frameworks/<configuration>/<sdk>/ (see the shared
        # iOS framework steps in ios.yml).
        FRAMEWORK_SEARCH_PATHS:
          - '$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        OTHER_LDFLAGS:
          - '-framework'
          - 'shared'
          # SQLDelight's native SQLite driver (SQLiter) inside the static shared
          # framework references libsqlite3 symbols the host app must resolve.
          - '-lsqlite3'
    info:
      path: Jackdaw/Info.plist
      properties:
        # Only standard (exempt) encryption is used, so declare no non-exempt
        # encryption — TestFlight then skips the per-build export-compliance
        # prompt that would otherwise block each upload.
        ITSAppUsesNonExemptEncryption: false
        # CloudKit pushes wake the app to fetch changes made on another device.
        UIBackgroundModes:
          - remote-notification
        CFBundleLocalizations:
          - en
          - de
        # `.jackdaw` packs offer to open in Jackdaw from Files, Mail, Messages, …
        # `LSSupportsOpeningDocumentsInPlace: false` makes iOS hand over a copy,
        # so the import never touches the sender's file.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Jackdaw pack
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - ch.orellbuehler.jackdaw.pack
          # Packs are JSON and some apps hand a received attachment over as plain
          # JSON rather than by its file extension; the import tells the user
          # when a file is not a pack.
          - CFBundleTypeName: JSON document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.json
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ch.orellbuehler.jackdaw.pack
            UTTypeDescription: Jackdaw pack
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - jackdaw
              public.mime-type:
                - application/vnd.jackdaw.pack+json
    dependencies:
      - framework: '../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/shared.framework'
        embed: false
