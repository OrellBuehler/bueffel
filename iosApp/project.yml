name: Bueffel
options:
  bundleIdPrefix: ch.orellbuehler
  deploymentTarget:
    iOS: '18.0'
  xcodeVersion: '16.2'

settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: 'NO'
    GENERATE_INFOPLIST_FILE: 'YES'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait'
    INFOPLIST_KEY_CFBundleDisplayName: Büffel

targets:
  Bueffel:
    type: application
    platform: iOS
    sources:
      - path: Bueffel
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: ch.orellbuehler.bueffel
        # Link the KMP shared framework. Gradle builds it and stages it under
        # shared/build/xcode-frameworks/<configuration>/<sdk>/ (see the shared
        # iOS framework steps in ios.yml).
        FRAMEWORK_SEARCH_PATHS:
          - '$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        OTHER_LDFLAGS:
          - '-framework'
          - 'shared'
          # SQLDelight's native SQLite driver (SQLiter) inside the static shared
          # framework references libsqlite3 symbols the host app must resolve.
          - '-lsqlite3'
    info:
      path: Bueffel/Info.plist
      properties:
        # Only standard (exempt) encryption is used, so declare no non-exempt
        # encryption — TestFlight then skips the per-build export-compliance
        # prompt that would otherwise block each upload.
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - framework: '../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/shared.framework'
        embed: false
